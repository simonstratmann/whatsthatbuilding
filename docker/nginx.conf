server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # The app's Overpass queries, forwarded to OVERPASS_URL; written at start-up by
  # docker/write-overpass-proxy.sh.
  include /etc/nginx/overpass-proxy.conf;

  # Hashed file names, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
