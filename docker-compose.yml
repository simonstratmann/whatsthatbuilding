# Example: both images side by side behind your own SSL-terminating reverse proxy (e.g. nginx),
# which forwards https://building.example.org → localhost:8080
#      and https://building-dev.example.org → localhost:4173.
#
# Settings come from the environment: put them in a .env file next to this one
# (ignored by git) or export them in your shell, e.g.
#   POSTGRES_PASSWORD=a-long-random-password
#   OVERPASS_URL=https://overpass.example.org/api/interpreter
#
# Both images share one PostGIS database and one GML file cache, so building data is
# downloaded and imported once. The schema is created when an app first starts.
#
# Import Hamburg's building model (a 650 MB download, 7 GB of GML kept in the cache, a few
# minutes to load; the database grows by about 200 MB), and again each April when a new
# release comes out:
#   docker compose run --rm app node server/src/import-hamburg.ts
#
# Niedersachsen's tiles (1 km each, up to 50 MB of GML) are downloaded from LGLN the first
# time a Snapshot needs them. To spare an area that first wait, preload it (WGS84 degrees:
# west south east north), e.g. Hannover:
#   docker compose run --rm app node server/src/preload-niedersachsen.ts 9.65 52.32 9.85 52.43
# A first Snapshot in a new area waits for its tiles, usually under 10 s; if LGLN is slow it
# can pass nginx's default 60 s proxy_read_timeout, so raise that for /api/ (e.g. to 180s).

x-app-environment: &app-environment
  DATABASE_URL: postgres://building:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgis:5432/building
  # The Overpass interpreter building names come from. Only the containers talk to it, so an
  # internal address works. Empty uses the public server.
  OVERPASS_URL: ${OVERPASS_URL:-}

services:
  app:
    image: ghcr.io/simonstratmann/whatsthatbuilding:latest
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment: *app-environment
    volumes:
      # Downloaded LoD2 GML files. The container runs as uid 1000, which must be able to write here.
      - lod2-cache:/app/cache
      # Aerial Photo tiles, up to DOP_CACHE_MAX_GB (default 20) before the oldest are deleted.
      - dop-cache:/app/dop-cache

  app-dev:
    image: ghcr.io/simonstratmann/whatsthatbuilding:dev-latest
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:8080"
    environment: *app-environment
    volumes:
      - lod2-cache:/app/cache
      # Its own Aerial Photo cache: each app keeps track of the size of the cache it writes to.
      - dop-cache-dev:/app/dop-cache
      # Request logs: requests.log and requests/<id>.json. The container runs as uid 1000,
      # which must be able to write here.
      - ./logs:/app/logs

  postgis:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: building
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: building
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U building -d building"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgis-data:
  lod2-cache:
  dop-cache:
  dop-cache-dev:
